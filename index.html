<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hack Pattern Helper</title>
  <style>
    :root {
      --bg: #121417;
      --panel: #20242a;
      --panel-border: #353b45;
      --slot: rgba(255, 255, 255, 0.05);
      --slot-border: rgba(255, 255, 255, 0.15);
      --neon-orange: #ff6a00;
      --orange-glow: rgba(255, 106, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      background: radial-gradient(circle at center, #1b1f26 0%, #0c0d10 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* Gornji statusni panel */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #a0a6b2;
    }

    .step-counter {
      color: #fff;
      font-size: 16px;
    }

    .step-counter span {
      color: var(--neon-orange);
      font-weight: 800;
    }

    /* Glavni 4x4 panel */
    .grid-board {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #252a32;
      border: 3px solid #3c4450;
      border-radius: 20px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 10px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
    }

    /* Pločica */
    .tile {
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid rgba(255, 255, 255, 0.09);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      cursor: pointer;
      position: relative;
      transition: all 0.1s ease;
    }

    .tile::after {
      content: '';
      position: absolute;
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 50%;
    }

    .tile:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.1);
    }

    /* Aktivno kliknuto polje */
    .tile.active {
      background: rgba(255, 106, 0, 0.22);
      border-color: var(--neon-orange);
      box-shadow: 0 0 16px var(--orange-glow), inset 0 0 8px var(--orange-glow);
      color: #fff;
      text-shadow: 0 0 12px var(--neon-orange);
      animation: pop 0.12s ease-out;
    }

    .tile.active::after {
      display: none;
    }

    @keyframes pop {
      0% { transform: scale(0.85); }
      100% { transform: scale(1); }
    }

    /* Kontrole / Dugmad */
    .controls {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 10px;
      width: 100%;
    }

    button {
      border: none;
      outline: none;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background 0.15s, transform 0.05s;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-undo {
      background: #2e3440;
      color: #d8dee9;
      border: 1px solid #434c5e;
    }

    .btn-reset {
      background: var(--neon-orange);
      color: #fff;
      box-shadow: 0 4px 16px var(--orange-glow);
    }

    .btn-reset:active {
      background: #e05d00;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <span>KLIKOVA:</span>
      <div class="step-counter"><span id="count">0</span> / 7</div>
    </div>

    <div class="grid-board" id="board">
      <!-- 16 polja (4x4) -->
    </div>

    <div class="controls">
      <button class="btn-undo" id="btnUndo">Obriši zadnji</button>
      <button class="btn-reset" id="btnReset">Reset (Prazno)</button>
    </div>
  </div>

  <script>
    const board = document.getElementById('board');
    const countDisplay = document.getElementById('count');
    const btnReset = document.getElementById('btnReset');
    const btnUndo = document.getElementById('btnUndo');

    let history = []; // Redoslijed ID-jeva kliknutih pločica

    // Generisanje 16 pločica
    for (let i = 0; i < 16; i++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.index = i;

      // Event listener optimizovan za telefon
      tile.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        handleTileClick(i);
      });

      board.appendChild(tile);
    }

    function handleTileClick(index) {
      const existingIdx = history.indexOf(index);

      // Ako je polje već kliknuto, ukloni ga i preračunaj ostale brojeve
      if (existingIdx !== -1) {
        history.splice(existingIdx, 1);
        updateBoard();
        return;
      }

      // Maksimalno 7 klikova
      if (history.length >= 7) return;

      history.push(index);
      updateBoard();
    }

    function updateBoard() {
      const allTiles = document.querySelectorAll('.tile');

      // Resetuj sve pločice vizuelno
      allTiles.forEach(tile => {
        tile.textContent = '';
        tile.classList.remove('active');
      });

      // Ispiši brojeve 1 do 7 po redoslijedu unosa
      history.forEach((tileIdx, step) => {
        const tile = allTiles[tileIdx];
        tile.textContent = step + 1;
        tile.classList.add('active');
      });

      countDisplay.textContent = history.length;
    }

    // Obriši zadnji unos
    btnUndo.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (history.length > 0) {
        history.pop();
        updateBoard();
      }
    });

    // Resetuj sve
    btnReset.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      history = [];
      updateBoard();
    });

    // Prečice za tastaturu ako se pokrene na PC-u (R za reset, Backspace za undo)
    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyR' || e.code === 'Space') {
        history = [];
        updateBoard();
      } else if (e.code === 'Backspace') {
        if (history.length > 0) {
          history.pop();
          updateBoard();
        }
      }
    });
  </script>
</body>
</html>
